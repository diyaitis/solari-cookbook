name: price-watcher

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/price-watcher-ts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install

      - name: Run watchlist check
        env:
          SOLARI_API_KEY: ${{ secrets.SOLARI_API_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: npm start

      # Runner filesystem is ephemeral, so state.json (last-seen values) has
      # to be committed back or every run looks like the first run and
      # nothing ever gets flagged as "changed".
      - name: Persist state.json
        run: |
          git config user.name "price-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "chore: update price-watcher state [skip ci]"
          git push
